<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#bbc0c1}canvas{display:block}</style></head><body><script type="module">
import * as T from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;document.body.append(renderer.domElement);const scene=new T.Scene();scene.background=new T.Color(0xbbc0c1);scene.add(new T.HemisphereLight(0xe8eff3,0xa09c82,2));const sun=new T.DirectionalLight(0xffedcf,3);sun.position.set(-10,16,9);scene.add(sun);const camera=new T.OrthographicCamera(-19,19,14.25,-14.25,.1,200);camera.position.set(22,24,30);camera.lookAt(0,1,0);let current;
